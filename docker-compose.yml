services:
  node:
    image: node:22-alpine
    working_dir: /app
    # Run as the host user so no root-owned files appear on the host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      # HOME is not writable for an arbitrary uid, keep the npm cache in /tmp
      npm_config_cache: /tmp/.npm
      DOCKER_HOST: ${DOCKER_HOST:-}
    volumes:
      - .:/app
    command: ["npm", "run", "dev"]
